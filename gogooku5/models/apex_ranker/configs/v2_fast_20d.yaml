version: 1
description: Fast v2 config using data_v2/ml_dataset-derived Parquet (20d horizon only, with listed meta).

data:
  parquet_path: data/output/datasets/apex_fast_20d.parquet
  metadata_path: null  # build_ml_dataset_fast.py writes <parquet>_metadata.json which train_v0 will pick up
  feature_groups_config: models/apex_ranker/configs/feature_groups_fast_v2.yaml
  feature_aliases_yaml: null
  feature_groups:
    - fast_v2
  optional_groups: []
  use_plus30: false
  lookback: 180
  min_stocks_per_day: 80
  date_column: Date
  code_column: Code
  target_columns:
    20: target_20d

normalization:
  mode: cross_section_z
  clip_sigma: 5.0

train:
  horizons:
    - 20
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 0.5
  val_days: 120
  log_interval: 10
  amp: true
  device: auto
  num_workers: 0
  warmup_epochs: 2
  warmup_start_factor: 0.1
  early_stopping:
    patience: 3
    metric: 20d_pak
    min_delta: 0.0
  evaluation:
    splitter: purged_kfold
    purged_kfold:
      n_splits: 5
      embargo_days: 5
  time_decay_tau_days: 120
  use_ema: true
  ema_beta: 0.999
  nvml_enabled: true
  nvml_device_index: 0
  nvml_sample_interval: 0.2

eval:
  k_ratio: 0.10
  ndcg_beta: 1.0

selection:
  default:
    k_ratio: 0.60
    k_min: 53
    sign: 1
  horizons:
    "20":
      k_ratio: 0.60
      k_min: 53
      sign: 1

model:
  d_model: 256
  depth: 4
  patch_len: 16
  stride: 8
  n_heads: 8
  dropout: 0.2

loss:
  listnet:
    weight: 1.0
    tau: 0.4
    topk: null
  ranknet:
    weight: 0.5
    neg_sample: 4096
  mse:
    weight: 0.1
  turnover:
    weight: 0.001
