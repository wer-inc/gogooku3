version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - admin-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/app
      - MODEL_DIR=/data/output
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - /workspace/gogooku3/gogooku5/output:/data/output:ro
    depends_on:
      - db
    networks:
      - admin-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - admin-network
    restart: unless-stopped

networks:
  admin-network:
    driver: bridge

volumes:
  postgres_data:
