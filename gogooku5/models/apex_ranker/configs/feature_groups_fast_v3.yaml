version: 1
description: Fast v3 feature preset for 20d-ahead ranking (price/flow + listed meta + fundamentals).

groups:
  fast_v3:
    description: Fast v2 core features + K1-style fundamental factors
    include:
      # --- Fast v2 core (46 features) ---
      # Price / Momentum
      - ret_1d
      - ret_5d
      - ret_20d
      - logret_1d
      - price_pos_20

      # Volatility
      - rv_5
      - rv_20
      - rv_ratio
      - range_z_20

      # Volume / Liquidity
      - vol_ratio_5
      - vol_ratio_20
      - val_ratio_5
      - val_ratio_20
      - log_amihud_20

      # Technical (TA)
      - rsi_14
      - macd_hist
      - macd_hist_diff_1
      - adx_14

      # Demand / Flow (breakdown + margin)
      - breakdown_buy_ratio
      - sell_short_ratio
      - inst_short_ratio_value
      - retail_lev_ratio_value
      - flow_imbalance
      - margin_flow_intensity
      - short_overhang_days
      - short_squeeze_risk

      # Margin capitulation
      - margin_capitulation_ratio
      - margin_capitulation_spike

      # Session (intra-day microstructure)
      - ret_morning
      - ret_afternoon
      - session_corr_20
      - morning_trend_eff
      - session_volume_ratio

      # --- Listed meta extensions ---
      # Sector alpha & percentiles (5d/20d)
      - sector_alpha_ret_5d
      - sector_alpha_ret_20d
      - sector_pct_ret_5d
      - sector_rank_ret_5d

      # Sector mean context
      - sector_ret_5d
      - sector_ret_20d

      # Market segment flags
      - is_prime
      - is_standard
      - is_growth

      # Size buckets
      - is_small_cap
      - is_mid_cap
      - is_large_cap

      # Shortability
      - is_shortable

      # --- K1-style Fundamental factors (14 features) ---
      # Net cash & valuation
      - fund_net_cash_k1
      - fund_net_cash_ratio_k1
      - fund_per_ttm
      - fund_pbr
      - fund_cash_neutral_per

      # Growth (YoY)
      - fund_yoy_sales
      - fund_yoy_profit
      - fund_yoy_cfo
      - fund_yoy_net_cash

      # Quality & profitability
      - fund_roe
      - fund_op_margin
      - fund_accruals

      # K1-style flags
      - fund_is_cash_rich
      - fund_value_trap_flag

    masks: []
